name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dev tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff>=0.5.0

      - name: Ruff check
        run: ruff check app tests

      - name: Ruff format check
        run: ruff format --check app tests

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Pytest
        env:
          PYTHONPATH: .
          DATA_DIR: ${{ runner.temp }}/ats-data
          OLLAMA_HOST: http://127.0.0.1:11434
          DEBUG: "false"
        run: pytest -q --tb=short

  security-hygiene:
    name: Secret hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject committed secrets / env files
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)\.env$|\.pem$|id_rsa|credentials\.json|secrets/' ; then
            echo "Sensitive paths must not be tracked."
            exit 1
          fi
          if git grep -nE 'ghp_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,}|OPENAI_API_KEY\s*=\s*["'\''][^"'\'']+' -- . \
            ':(exclude).github/workflows/*' \
            ':(exclude)README.md' \
            ':(exclude)spec/**' 2>/dev/null; then
            echo "Possible secret material in tree."
            exit 1
          fi
          echo "OK: no obvious secrets tracked."

<section class="card">
  <h2>Fakten (JSON)</h2>
  {% if not facts and not facts_json %}
  <p class="meta">Noch kein Draft. Strukturieren oder Fixture laden.</p>
  {% else %}
  <form method="post" action="/cv/{{ cv.id }}/facts" class="form">
    <label for="facts_json">CV-JSON</label>
    <textarea id="facts_json" name="facts_json" rows="24" spellcheck="false">{% if facts_json %}{{ facts_json }}{% elif facts %}{{ facts | tojson }}{% endif %}</textarea>
    <div class="btn-row">
      <button type="submit" class="btn">Entwurf speichern</button>
    </div>
  </form>
  <form method="post" action="/cv/{{ cv.id }}/lock" class="form" style="margin-top:.75rem"
        onsubmit="return confirm('Fakten jetzt sperren? Ein erneuter Lock archiviert den vorherigen.');">
    <p class="meta">Sperrt den zuletzt gespeicherten Entwurf (oder den JSON-Stand nach „Entwurf speichern“).</p>
    <button type="submit" class="btn primary">Fakten sperren</button>
  </form>
  {% endif %}
</section>
